<!doctype html>
<html lang="en">

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="color-scheme" content="dark" />

    <!-- SEO Meta Tags -->
    <title>PawsFinder | Lost Pet Recovery &amp; Neighborhood Rescue Network</title>
    <meta name="description" content="PawsFinder helps reunite lost pets with their families through community alerts and print-ready street posters — serving Nepal and worldwide." />

    <meta name="author" content="PawsFinder" />
    <link rel="canonical" href="https://pawsfinder.org/" />

    <!-- Open Graph / Social Share -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PawsFinder" />
    <meta property="og:title" content="PawsFinder | Lost Pet Recovery &amp; Neighborhood Rescue Network" />
    <meta property="og:description" content="Report a missing dog, generate printable street posters, and notify your local community instantly." />
    <meta property="og:image" content="https://pawsfinder.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PawsFinder — Lost Pet Recovery Network" />
    <meta property="og:url" content="https://pawsfinder.org/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PawsFinder | Lost Pet Recovery Network" />
    <meta name="twitter:description" content="Helping reunite lost pets with their families through community alerts and printable posters." />
    <meta name="twitter:image" content="https://pawsfinder.org/og-image.png" />
    <meta name="twitter:image:alt" content="PawsFinder — Lost Pet Recovery Network" />

    <!-- Security -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Google Fonts: Inter & Outfit (preconnect for performance) -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
